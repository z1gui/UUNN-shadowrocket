Final = select, Proxy, DIRECT, OUT, REJECT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2

# Regions. OUT nodes are excluded by the leading negative lookahead.
HK = select, policy-regex-filter=(?i)^(?!=>).*(?:🇭🇰|香港|Hong ?Kong|(?:^|[^A-Z])HK(?:G)?[0-9]*(?:[^A-Z]|$)).*$
TW = select, policy-regex-filter=(?i)^(?!=>).*(?:🇹🇼|台湾|Taiwan|Tai Wan|(?:^|[^A-Z])TW(?:N)?[0-9]*(?:[^A-Z]|$)).*$
JP = select, policy-regex-filter=(?i)^(?!=>).*(?:🇯🇵|日本|东京|大阪|Japan|(?:^|[^A-Z])JP(?:N)?[0-9]*(?:[^A-Z]|$)).*$
KR = select, policy-regex-filter=(?i)^(?!=>).*(?:🇰🇷|韩国|首尔|Korea|(?:^|[^A-Z])(?:KR|KOR)[0-9]*(?:[^A-Z]|$)).*$
SG = select, policy-regex-filter=(?i)^(?!=>).*(?:🇸🇬|新加坡|狮城|Singapore|(?:^|[^A-Z])SG(?:P)?[0-9]*(?:[^A-Z]|$)).*$
US = select, policy-regex-filter=(?i)^(?!=>).*(?:🇺🇸|美国|洛杉矶|圣何塞|西雅图|芝加哥|United States|(?:^|[^A-Z])US(?:A)?[0-9]*(?:[^A-Z]|$)).*$
OTHERS1 = select, policy-regex-filter=(?i)^(?!=>)(?!.*(?:🇭🇰|香港|Hong ?Kong|🇹🇼|台湾|Taiwan|🇯🇵|日本|东京|大阪|Japan|🇰🇷|韩国|首尔|Korea|🇸🇬|新加坡|Singapore|🇺🇸|美国|United States))(?!.*(?:群|邀请|官网|客服|订阅|流量|到期|剩余|过期|Traffic|Expire|Panel)).*$
OTHERS2 = select, policy-regex-filter=(?i)^(?!=>)(?!.*(?:🇭🇰|香港|Hong ?Kong|🇹🇼|台湾|Taiwan|🇯🇵|日本|东京|大阪|Japan|🇰🇷|韩国|首尔|Korea|🇸🇬|新加坡|Singapore|🇺🇸|美国|United States))(?!.*(?:群|邀请|官网|客服|订阅|流量|到期|剩余|过期|Traffic|Expire|Panel)).*$

